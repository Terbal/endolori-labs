<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Endolori Labs — Statistiques</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060d; --surface:#0c1226; --ink:#EEF1FB; --ink-soft:#8b93b3; --ink-dim:#565f82;
  --accent:#6E8CFF; --accent-soft:#93AEFF; --border:rgba(255,255,255,0.10);
  --font-display:'Space Grotesk',sans-serif; --font-body:'Inter',sans-serif; --font-mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);min-height:100vh;padding:60px 6vw 80px;}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.02em;}
.sub{color:var(--ink-soft);margin-top:8px;font-size:14px;}
.warn{
  margin-top:24px;padding:14px 18px;border-radius:14px;background:rgba(110,140,255,.08);
  border:1px solid rgba(110,140,255,.25);color:var(--accent-soft);font-size:13px;line-height:1.6;max-width:760px;
}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px;}
@media(max-width:900px){.grid{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.grid{grid-template-columns:1fr;}}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px 22px;
}
.card .label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);}
.card .value{font-family:var(--font-display);font-size:32px;font-weight:600;margin-top:10px;color:var(--ink);}
.card .value .unit{font-size:15px;color:var(--ink-soft);font-weight:500;margin-left:4px;}
.section{margin-top:44px;}
.section h2{font-family:var(--font-display);font-size:18px;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.bars{display:flex;flex-direction:column;gap:12px;}
.bar-row{display:flex;align-items:center;gap:14px;}
.bar-row .name{width:110px;font-size:13px;color:var(--ink-soft);flex-shrink:0;}
.bar-track{flex:1;height:10px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-soft));border-radius:6px;transition:width .6s ease;}
.bar-row .count{width:44px;text-align:right;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-dim);flex-shrink:0;}
.meta{margin-top:44px;font-family:var(--font-mono);font-size:12.5px;color:var(--ink-dim);line-height:2;}
.action-btn{
  padding:10px 20px;border-radius:100px;border:1px solid var(--border);background:transparent;
  color:var(--ink-soft);font-size:12.5px;font-family:var(--font-body);cursor:pointer;transition:.3s;
}
.action-btn:hover{border-color:var(--accent);color:var(--accent);}
.action-btn.danger:hover{border-color:#ff6b6b;color:#ff6b6b;}
.action-row{display:flex;gap:10px;margin-top:44px;flex-wrap:wrap;}
.empty{margin-top:24px;color:var(--ink-dim);font-size:14px;}
.filter-toggle{
  display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-dim);cursor:pointer;user-select:none;
  border:1px solid var(--border);border-radius:100px;padding:7px 14px;margin-left:auto;
}
.filter-toggle input{accent-color:var(--accent);}
.lead-card{
  background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin-bottom:14px;
  transition:opacity .3s;
}
.lead-card.archived{opacity:.55;}
.lead-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;}
.lead-company{font-family:var(--font-display);font-size:17px;font-weight:600;}
.lead-score{
  font-family:var(--font-mono);font-size:12px;font-weight:600;padding:5px 12px;border-radius:100px;flex-shrink:0;
}
.lead-score.low{color:#2e8b57;background:rgba(46,139,87,.12);}
.lead-score.moderate{color:var(--accent);background:rgba(110,140,255,.12);}
.lead-score.high{color:#c9820a;background:rgba(201,130,10,.12);}
.lead-score.critical{color:#ff6b6b;background:rgba(255,107,107,.12);}
.lead-meta{font-size:12.5px;color:var(--ink-dim);margin-top:6px;}
.lead-answers{margin-top:12px;font-size:13px;color:var(--ink-soft);line-height:1.9;}
.lead-message{margin-top:10px;font-size:13px;color:var(--ink-soft);font-style:italic;border-left:2px solid var(--border);padding-left:12px;}
.lead-controls{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border);flex-wrap:wrap;align-items:center;}
.status-select{
  padding:8px 14px;border-radius:100px;border:1px solid var(--border);background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:12.5px;cursor:pointer;
}
.status-select.st-nouveau{border-color:var(--accent);color:var(--accent);}
.status-select.st-a_contacter{border-color:#c9820a;color:#c9820a;}
.status-select.st-contacte{border-color:#3ec9c9;color:#3ec9c9;}
.status-select.st-en_discussion{border-color:var(--accent-soft);color:var(--accent-soft);}
.status-select.st-proposition_envoyee{border-color:#e0b23e;color:#e0b23e;}
.status-select.st-gagne{border-color:#2e8b57;color:#2e8b57;}
.status-select.st-perdu{border-color:#8a8f9c;color:#8a8f9c;}
</style>
</head>
<body>
  <h1>Endolori Labs — Tableau de bord</h1>
  <p class="sub">Accès privé — session sécurisée</p>

  <div class="warn">
    Ces statistiques et demandes sont enregistrées de façon permanente côté serveur. Cette page n'est accessible qu'après connexion avec un nom d'utilisateur et un mot de passe valides.
  </div>

  <div id="content"></div>
  <div id="leadsContent"></div>

  <div class="action-row">
    <button class="action-btn danger" id="resetStatsBtn">Réinitialiser les statistiques</button>
    <button class="action-btn" id="logoutBtn">Se déconnecter</button>
  </div>

<script>
async function apiFetch(url, opts){
  const res = await fetch(url, Object.assign({cache:'no-store'}, opts || {}));
  if(res.status === 401){
    window.location.href = '/';
    throw new Error('Unauthorized');
  }
  return res;
}

async function loadStats(){
  try{
    const res = await apiFetch('/api/stats');
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
function fmtDuration(totalSeconds){
  totalSeconds = Math.round(totalSeconds || 0);
  const h = Math.floor(totalSeconds/3600);
  const m = Math.floor((totalSeconds%3600)/60);
  const s = totalSeconds%60;
  if(h>0) return `${h}h ${m}m ${s}s`;
  if(m>0) return `${m}m ${s}s`;
  return `${s}s`;
}
function fmtDate(ts){
  if(!ts) return '—';
  const d = new Date(ts);
  return d.toLocaleString('fr-FR', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

async function render(){
  const stats = await loadStats();
  const content = document.getElementById('content');
  if(!stats){
    content.innerHTML = '<p class="empty">Impossible de charger les statistiques pour l\'instant (le serveur est peut-être en train de démarrer). Réessaie dans quelques secondes.</p>';
    return;
  }

  const avgWatch = stats.videoPlays > 0 ? stats.totalWatchSeconds / stats.videoPlays : 0;
  const lang = stats.langCounts || {en:0,fr:0};
  const theme = stats.themeCounts || {light:0,dark:0};
  const device = stats.deviceCounts || {mobile:0,desktop:0};
  const langTotal = Math.max(1, (lang.en||0) + (lang.fr||0));
  const themeTotal = Math.max(1, (theme.light||0) + (theme.dark||0));
  const deviceTotal = Math.max(1, (device.mobile||0) + (device.desktop||0));

  content.innerHTML = `
    <div class="grid">
      <div class="card"><div class="label">Pages vues</div><div class="value">${stats.pageViews||0}</div></div>
      <div class="card"><div class="label">Clics sur la vidéo</div><div class="value">${stats.videoPlays||0}</div></div>
      <div class="card"><div class="label">Temps de visionnage total</div><div class="value" style="font-size:22px;">${fmtDuration(stats.totalWatchSeconds)}</div></div>
      <div class="card"><div class="label">Temps moyen / lecture</div><div class="value" style="font-size:22px;">${fmtDuration(avgWatch)}</div></div>
    </div>

    <div class="section">
      <h2>Langue préférée (clics sur le switch)</h2>
      <div class="bars">
        <div class="bar-row"><span class="name">Français</span><div class="bar-track"><div class="bar-fill" style="width:${(lang.fr||0)/langTotal*100}%"></div></div><span class="count">${lang.fr||0}</span></div>
        <div class="bar-row"><span class="name">Anglais</span><div class="bar-track"><div class="bar-fill" style="width:${(lang.en||0)/langTotal*100}%"></div></div><span class="count">${lang.en||0}</span></div>
      </div>
    </div>

    <div class="section">
      <h2>Thème préféré (clics sur le switch)</h2>
      <div class="bars">
        <div class="bar-row"><span class="name">Clair</span><div class="bar-track"><div class="bar-fill" style="width:${(theme.light||0)/themeTotal*100}%"></div></div><span class="count">${theme.light||0}</span></div>
        <div class="bar-row"><span class="name">Sombre</span><div class="bar-track"><div class="bar-fill" style="width:${(theme.dark||0)/themeTotal*100}%"></div></div><span class="count">${theme.dark||0}</span></div>
      </div>
    </div>

    <div class="section">
      <h2>Appareils</h2>
      <div class="bars">
        <div class="bar-row"><span class="name">Mobile</span><div class="bar-track"><div class="bar-fill" style="width:${(device.mobile||0)/deviceTotal*100}%"></div></div><span class="count">${device.mobile||0}</span></div>
        <div class="bar-row"><span class="name">Ordinateur</span><div class="bar-track"><div class="bar-fill" style="width:${(device.desktop||0)/deviceTotal*100}%"></div></div><span class="count">${device.desktop||0}</span></div>
      </div>
    </div>

    <div class="meta">
      Première visite enregistrée : ${fmtDate(stats.firstVisit)}<br>
      Dernière visite : ${fmtDate(stats.lastVisit)}
    </div>
  `;
}

const STATUS_LABELS = {
  nouveau: 'Nouveau',
  a_contacter: 'À contacter',
  contacte: 'Contacté',
  en_discussion: 'En discussion',
  proposition_envoyee: 'Proposition envoyée',
  gagne: 'Gagné',
  perdu: 'Perdu'
};

let showArchived = false;
let cachedLeads = [];
let sortBy = 'date_desc';
let statusFilter = 'all';

const SORT_LABELS = {
  date_desc: 'Date (récent → ancien)',
  date_asc: 'Date (ancien → récent)',
  score_desc: 'Score (élevé → faible)',
  score_asc: 'Score (faible → élevé)',
  company_asc: 'Entreprise (A → Z)',
  company_desc: 'Entreprise (Z → A)',
  status: 'Statut'
};

function sortLeads(leads){
  const arr = [...leads];
  switch(sortBy){
    case 'date_asc': return arr.sort((a,b)=> a.createdAt - b.createdAt);
    case 'score_desc': return arr.sort((a,b)=> b.score - a.score);
    case 'score_asc': return arr.sort((a,b)=> a.score - b.score);
    case 'company_asc': return arr.sort((a,b)=> a.companyName.localeCompare(b.companyName));
    case 'company_desc': return arr.sort((a,b)=> b.companyName.localeCompare(a.companyName));
    case 'status': {
      const order = Object.keys(STATUS_LABELS);
      return arr.sort((a,b)=> order.indexOf(a.status||'nouveau') - order.indexOf(b.status||'nouveau'));
    }
    case 'date_desc':
    default: return arr.sort((a,b)=> b.createdAt - a.createdAt);
  }
}

function sortOptionsHtml(){
  return Object.keys(SORT_LABELS).map(key =>
    `<option value="${key}" ${key === sortBy ? 'selected' : ''}>${SORT_LABELS[key]}</option>`
  ).join('');
}

function statusFilterOptionsHtml(){
  let html = `<option value="all" ${statusFilter === 'all' ? 'selected' : ''}>Tous les statuts</option>`;
  html += Object.keys(STATUS_LABELS).map(key =>
    `<option value="${key}" ${key === statusFilter ? 'selected' : ''}>${STATUS_LABELS[key]}</option>`
  ).join('');
  return html;
}

async function loadLeads(){
  try{
    const res = await apiFetch('/api/leads');
    if(!res.ok) return [];
    return await res.json();
  }catch(e){ return []; }
}

function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function statusOptionsHtml(current){
  return Object.keys(STATUS_LABELS).map(key =>
    `<option value="${key}" ${key === current ? 'selected' : ''}>${STATUS_LABELS[key]}</option>`
  ).join('');
}

function renderLeadsList(){
  const wrap = document.getElementById('leadsContent');
  let visible = cachedLeads.filter(l => showArchived ? true : !l.archived);
  if(statusFilter !== 'all'){
    visible = visible.filter(l => (l.status || 'nouveau') === statusFilter);
  }
  const sorted = sortLeads(visible);

  let html = `<div class="section"><h2>Demandes reçues (${sorted.length})
    <select class="status-select" id="sortBySelect" style="border-color:var(--border);color:var(--ink-soft);">${sortOptionsHtml()}</select>
    <select class="status-select" id="statusFilterSelect" style="border-color:var(--border);color:var(--ink-soft);">${statusFilterOptionsHtml()}</select>
    <label class="filter-toggle"><input type="checkbox" id="showArchivedToggle" ${showArchived ? 'checked' : ''}> Afficher les archivées</label>
  </h2>`;

  if(!sorted.length){
    html += '<p class="empty">Aucune demande à afficher.</p>';
  } else {
    sorted.forEach(lead=>{
      const status = lead.status || 'nouveau';
      html += `
        <div class="lead-card ${lead.archived ? 'archived' : ''}" data-id="${lead.id}">
          <div class="lead-top">
            <div>
              <div class="lead-company">${escapeHtml(lead.companyName)}</div>
              <div class="lead-meta">${escapeHtml(lead.contactName)} · ${escapeHtml(lead.contactEmail)}${lead.phone ? ' · ' + escapeHtml(lead.phone) : ''}</div>
              <div class="lead-meta">${escapeHtml(lead.sector || '—')} · ${escapeHtml(lead.teamSize || '—')} · ${fmtDate(lead.createdAt)}</div>
            </div>
            <span class="lead-score ${lead.bracket}">${lead.score}% · ${lead.bracket}</span>
          </div>
          <div class="lead-answers">
            Volume e-mails : ${escapeHtml(lead.answers.emailVolume)} &nbsp;·&nbsp;
            Personnes impliquées : ${escapeHtml(lead.answers.peopleInvolved)} &nbsp;·&nbsp;
            Suivi manuel : ${escapeHtml(lead.answers.manualTracking)} &nbsp;·&nbsp;
            Automatisation existante : ${escapeHtml(lead.answers.existingAutomation)} &nbsp;·&nbsp;
            Temps perdu/semaine : ${escapeHtml(lead.answers.timeLost)}
          </div>
          ${lead.message ? `<div class="lead-message">"${escapeHtml(lead.message)}"</div>` : ''}
          <div class="lead-controls">
            <select class="status-select st-${status}" data-action="status" data-id="${lead.id}">
              ${statusOptionsHtml(status)}
            </select>
            <button class="action-btn" data-action="archive" data-id="${lead.id}">${lead.archived ? 'Désarchiver' : 'Archiver'}</button>
            <button class="action-btn danger" data-action="delete" data-id="${lead.id}">Supprimer</button>
          </div>
        </div>`;
    });
  }
  html += '</div>';
  wrap.innerHTML = html;

  document.getElementById('showArchivedToggle').addEventListener('change', function(){
    showArchived = this.checked;
    renderLeadsList();
  });

  document.getElementById('sortBySelect').addEventListener('change', function(){
    sortBy = this.value;
    renderLeadsList();
  });

  document.getElementById('statusFilterSelect').addEventListener('change', function(){
    statusFilter = this.value;
    renderLeadsList();
  });

  wrap.querySelectorAll('select[data-action="status"]').forEach(sel=>{
    sel.addEventListener('change', async function(){
      const id = this.dataset.id;
      const newStatus = this.value;
      try{
        await apiFetch(`/api/leads/${id}`, {
          method: 'PATCH',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ status: newStatus })
        });
        const lead = cachedLeads.find(l => l.id === id);
        if(lead) lead.status = newStatus;
        this.className = 'status-select st-' + newStatus;
      }catch(e){}
    });
  });

  wrap.querySelectorAll('button[data-action="archive"]').forEach(btn=>{
    btn.addEventListener('click', async function(){
      const id = this.dataset.id;
      const lead = cachedLeads.find(l => l.id === id);
      if(!lead) return;
      const nextArchived = !lead.archived;
      try{
        await apiFetch(`/api/leads/${id}`, {
          method: 'PATCH',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ archived: nextArchived })
        });
        lead.archived = nextArchived;
        renderLeadsList();
      }catch(e){}
    });
  });

  wrap.querySelectorAll('button[data-action="delete"]').forEach(btn=>{
    btn.addEventListener('click', async function(){
      const id = this.dataset.id;
      if(!confirm('Supprimer définitivement cette demande ? Cette action est irréversible.')) return;
      try{
        await apiFetch(`/api/leads/${id}`, { method: 'DELETE' });
        cachedLeads = cachedLeads.filter(l => l.id !== id);
        renderLeadsList();
      }catch(e){}
    });
  });
}

async function renderLeads(){
  cachedLeads = await loadLeads();
  renderLeadsList();
}

document.addEventListener('DOMContentLoaded', function(){
  render();
  renderLeads();

  document.getElementById('resetStatsBtn').addEventListener('click', async function(){
    if(confirm('Effacer définitivement toutes les statistiques enregistrées sur le serveur ?')){
      try{ await apiFetch('/api/stats/reset', {method:'POST'}); }catch(e){}
      render();
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', async function(){
    try{ await fetch('/api/auth/logout', {method:'POST'}); }catch(e){}
    window.location.href = '/';
  });
});
</script>
</body>
</html>
